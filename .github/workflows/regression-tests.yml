name: Regression Tests
on:
  workflow_dispatch:
    inputs:
      env_name:
        description: 'Target environment'
        required: false
        default: prod
        type: choice
        options:
          - qa
          - prod
  schedule:
    - cron: '0 6 * * 5'

jobs:
  # Required check name: "regression / run"
  regression:
    permissions:
      contents: write
      actions: write
      checks: write
    uses: ./.github/workflows/run-playwright.yml
    with:
      suite: regression
      env_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.env_name || 'prod' }}
    secrets: inherit

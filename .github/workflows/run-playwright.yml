name: Run Playwright

on:
  workflow_call:
    inputs:
      suite:
        description: 'Test suite name and report folder (smoke or regression). Also used as --grep=@<suite>.'
        required: true
        type: string
      env_name:
        description: 'Target environment'
        required: false
        type: string
        default: prod

permissions:
  contents: write
  actions: write
  checks: write

concurrency:
  group: run-playwright-${{ inputs.suite }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble

jobs:
  run:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ENV_NAME: ${{ inputs.env_name }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Create env file from secrets
        env:
          ENV_FILE_QA: ${{ secrets.ENV_FILE_QA }}
          ENV_FILE_PROD: ${{ secrets.ENV_FILE_PROD }}
        run: |
          if [ "$ENV_NAME" = "qa" ]; then
            printf '%s' "$ENV_FILE_QA" > "config/.env.${ENV_NAME}"
          else
            printf '%s' "$ENV_FILE_PROD" > "config/.env.${ENV_NAME}"
          fi
          if [ ! -s "config/.env.${ENV_NAME}" ]; then
            echo "::error::config/.env.${ENV_NAME} is empty. Check that the ENV_FILE_* secret is set for this environment."
            exit 1
          fi
      - name: Run Playwright tests
        run: |
          docker run --rm \
            --ipc=host \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e CI \
            -e "env_name=$ENV_NAME" \
            "${{ env.PLAYWRIGHT_IMAGE }}" \
            bash -ec "npm ci && npx playwright test --grep=@${{ inputs.suite }}"
      - name: Publish JUnit Test Report
        uses: mikepenz/action-junit-report@v6.4.0
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/out/reports/junitReport.xml'
      - uses: actions/upload-artifact@v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.suite }}
          path: out/reports/playwright/
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: ortoni-report-${{ inputs.suite }}
          path: out/reports/ortoni/
          retention-days: 30
      - name: Get previous reports
        uses: actions/checkout@v6.0.2
        if: always()
        continue-on-error: true
        with:
          ref: reports
          path: reports-prev
      - name: Restore Allure history.jsonl
        if: always()
        run: |
          SUITE="${{ inputs.suite }}"
          mkdir -p out/results
          # Persisted on the reports branch at <suite>/allure/history.jsonl
          if [ -f "reports-prev/${SUITE}/allure/history.jsonl" ]; then
            cp "reports-prev/${SUITE}/allure/history.jsonl" out/results/allure-history.jsonl
            echo "Restored Allure history ($(wc -l < out/results/allure-history.jsonl) entries)"
          else
            echo "No previous Allure history.jsonl found for ${SUITE}"
          fi
      - name: Write Allure executor.json
        if: always()
        run: |
          SUITE="${{ inputs.suite }}"
          RUN_NUM="${{ github.run_number }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPORT_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/${SUITE}/allure"
          REPORT_URL="${REPORT_BASE}/${RUN_NUM}"
          mkdir -p out/results/allure
          # Executor metadata for the report UI. Allure 3 does not copy reportUrl into
          # history.jsonl (Allure 2 did), so we also stamp history after generate.
          REPORT_BASE="$REPORT_BASE" REPORT_URL="$REPORT_URL" RUN_NUM="$RUN_NUM" \
          BUILD_NAME="GitHub Actions Run #${{ github.run_id }}" \
          BUILD_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "name": "GitHub Actions",
              "type": "github",
              "url": os.environ["REPORT_BASE"],
              "reportName": "Playwright Report",
              "buildOrder": int(os.environ["RUN_NUM"]),
              "buildName": os.environ["BUILD_NAME"],
              "buildUrl": os.environ["BUILD_URL"],
              "reportUrl": os.environ["REPORT_URL"],
          }
          Path("out/results/allure/executor.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          echo "REPORT_URL=${REPORT_URL}" >> "$GITHUB_ENV"
          echo "Allure report URL: ${REPORT_URL}"
      - name: Build Allure Report
        if: always()
        run: |
          rm -rf out/reports/allure
          # Uses allurerc.mjs (historyPath: out/results/allure-history.jsonl)
          npx allure generate ./out/results/allure --history-limit 20
      - name: Stamp Allure history URLs
        if: always()
        run: |
          # History tab links only appear when history entries have a non-empty url.
          HISTORY_FILE=out/results/allure-history.jsonl
          if [ ! -f "$HISTORY_FILE" ] || [ -z "${REPORT_URL:-}" ]; then
            echo "Skipping history URL stamp (missing history file or REPORT_URL)"
            exit 0
          fi
          REPORT_URL="$REPORT_URL" HISTORY_FILE="$HISTORY_FILE" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["HISTORY_FILE"])
          url = os.environ["REPORT_URL"]
          lines = path.read_text().splitlines()
          if not lines:
              raise SystemExit(0)

          entry = json.loads(lines[-1])
          entry["url"] = url
          for result in entry.get("testResults", {}).values():
              if isinstance(result, dict):
                  result["url"] = url
          lines[-1] = json.dumps(entry, ensure_ascii=False, separators=(",", ":"))
          path.write_text("\n".join(lines) + "\n")
          print(f"Stamped history url on latest entry: {url}")
          PY
      - name: Stage reports for deploy
        id: stage-reports
        if: always()
        run: |
          SUITE="${{ inputs.suite }}"
          RUN_NUM="${{ github.run_number }}"
          KEEP_REPORTS=20
          mkdir -p deploy

          if [ -d out/reports/allure ]; then
            mkdir -p "deploy/${SUITE}/allure/${RUN_NUM}"

            # Keep previous numbered Allure runs (same idea as the old action)
            if [ -d "reports-prev/${SUITE}/allure" ]; then
              cp -a "reports-prev/${SUITE}/allure/." "deploy/${SUITE}/allure/"
            fi

            # Publish this run and point the suite index at it.
            # Awesome History links are built as {reportUrl}/awesome#<testId>, so the
            # real report must live under awesome/ (not a redirect shim at that path).
            rm -rf "deploy/${SUITE}/allure/${RUN_NUM}"
            mkdir -p "deploy/${SUITE}/allure/${RUN_NUM}/awesome"
            cp -a out/reports/allure/. "deploy/${SUITE}/allure/${RUN_NUM}/awesome/"

            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<meta charset="utf-8">' \
              '<meta http-equiv="refresh" content="0; url=awesome/">' \
              "<title>Redirecting to Allure report #${RUN_NUM}</title>" \
              '<a href="awesome/">Allure report</a>' \
              > "deploy/${SUITE}/allure/${RUN_NUM}/index.html"

            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<meta charset="utf-8">' \
              "<meta http-equiv=\"refresh\" content=\"0; url=${RUN_NUM}/\">" \
              "<title>Redirecting to Allure report #${RUN_NUM}</title>" \
              "<a href=\"${RUN_NUM}/\">Allure report #${RUN_NUM}</a>" \
              > "deploy/${SUITE}/allure/index.html"

            # Persist Allure 3 history for the next workflow run
            if [ -f out/results/allure-history.jsonl ]; then
              cp out/results/allure-history.jsonl "deploy/${SUITE}/allure/history.jsonl"
            fi

            # Drop oldest numbered runs, keep the latest KEEP_REPORTS
            cd "deploy/${SUITE}/allure"
            ls -1d [0-9]* 2>/dev/null | sort -n | head -n "-${KEEP_REPORTS}" | xargs -r rm -rf
            cd "${GITHUB_WORKSPACE}"
          fi

          if [ -d out/reports/playwright ]; then
            mkdir -p "deploy/${SUITE}/playwright"
            cp -a out/reports/playwright/. "deploy/${SUITE}/playwright/"
          fi
          if [ -d out/reports/ortoni ]; then
            mkdir -p "deploy/${SUITE}/ortoni"
            cp -a out/reports/ortoni/. "deploy/${SUITE}/ortoni/"
          fi

          if [ -z "$(find deploy -type f | head -n 1)" ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy reports to reports branch
        id: deploy-reports
        if: always() && steps.stage-reports.outputs.has_files == 'true'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: reports
          folder: deploy
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout reports branch for manifest
        if: always() && steps.deploy-reports.outcome == 'success'
        uses: actions/checkout@v6.0.2
        with:
          ref: reports
          path: reports-root
      - name: Generate reports manifest
        if: always() && steps.deploy-reports.outcome == 'success'
        working-directory: reports-root
        run: |
          # Parent checkout has package.json "type": "module", so plain .js
          # is treated as ESM. Run as .cjs to keep require() working.
          cp generate_manifest.js generate_manifest.cjs
          node generate_manifest.cjs
          rm -f generate_manifest.cjs
      - name: Stage manifest for deploy
        if: always() && steps.deploy-reports.outcome == 'success'
        run: |
          mkdir -p manifest-deploy
          cp reports-root/manifest.json manifest-deploy/
      - name: Deploy updated manifest.json
        if: always() && steps.deploy-reports.outcome == 'success'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: reports
          folder: manifest-deploy
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}

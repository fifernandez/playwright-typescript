name: Run Playwright

on:
  workflow_call:
    inputs:
      suite:
        description: 'Test suite name and report folder (smoke or regression). Also used as --grep=@<suite>.'
        required: true
        type: string
      env_name:
        description: 'Target environment'
        required: false
        type: string
        default: prod

permissions:
  contents: write
  actions: write
  checks: write

concurrency:
  group: run-playwright-${{ inputs.suite }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble

jobs:
  run:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ENV_NAME: ${{ inputs.env_name }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Create env file from secrets
        env:
          ENV_FILE_QA: ${{ secrets.ENV_FILE_QA }}
          ENV_FILE_PROD: ${{ secrets.ENV_FILE_PROD }}
        run: |
          if [ "$ENV_NAME" = "qa" ]; then
            printf '%s' "$ENV_FILE_QA" > "config/.env.${ENV_NAME}"
          else
            printf '%s' "$ENV_FILE_PROD" > "config/.env.${ENV_NAME}"
          fi
          if [ ! -s "config/.env.${ENV_NAME}" ]; then
            echo "::error::config/.env.${ENV_NAME} is empty. Check that the ENV_FILE_* secret is set for this environment."
            exit 1
          fi
      - name: Run Playwright tests
        run: |
          docker run --rm \
            --ipc=host \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e CI \
            -e "env_name=$ENV_NAME" \
            "${{ env.PLAYWRIGHT_IMAGE }}" \
            bash -ec "npm ci && npx playwright test --grep=@${{ inputs.suite }}"
      - name: Publish JUnit Test Report
        uses: mikepenz/action-junit-report@v6.4.0
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/out/reports/junitReport.xml'
      - uses: actions/upload-artifact@v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.suite }}
          path: out/reports/playwright/
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: ortoni-report-${{ inputs.suite }}
          path: out/reports/ortoni/
          retention-days: 30
      - name: Get previous reports
        uses: actions/checkout@v6.0.2
        if: always()
        continue-on-error: true
        with:
          ref: reports
          path: reports-prev
      - name: Restore Allure history.jsonl
        if: always()
        run: |
          SUITE="${{ inputs.suite }}"
          mkdir -p out/results
          # Persisted on the reports branch at <suite>/allure/history.jsonl
          if [ -f "reports-prev/${SUITE}/allure/history.jsonl" ]; then
            cp "reports-prev/${SUITE}/allure/history.jsonl" out/results/allure-history.jsonl
            echo "Restored Allure history ($(wc -l < out/results/allure-history.jsonl) entries)"
          else
            echo "No previous Allure history.jsonl found for ${SUITE}"
          fi
      - name: Build Allure Report
        if: always()
        run: |
          rm -rf out/reports/allure
          # Uses allurerc.mjs (historyPath: out/results/allure-history.jsonl)
          npx allure generate ./out/results/allure --history-limit 20
      - name: Stage reports for deploy
        id: stage-reports
        if: always()
        run: |
          SUITE="${{ inputs.suite }}"
          RUN_NUM="${{ github.run_number }}"
          KEEP_REPORTS=20
          mkdir -p deploy

          if [ -d out/reports/allure ]; then
            mkdir -p "deploy/${SUITE}/allure/${RUN_NUM}"

            # Keep previous numbered Allure runs (same idea as the old action)
            if [ -d "reports-prev/${SUITE}/allure" ]; then
              cp -a "reports-prev/${SUITE}/allure/." "deploy/${SUITE}/allure/"
            fi

            # Publish this run and point the suite index at it
            rm -rf "deploy/${SUITE}/allure/${RUN_NUM}"
            mkdir -p "deploy/${SUITE}/allure/${RUN_NUM}"
            cp -a out/reports/allure/. "deploy/${SUITE}/allure/${RUN_NUM}/"
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<meta charset="utf-8">' \
              "<meta http-equiv=\"refresh\" content=\"0; url=${RUN_NUM}/\">" \
              "<title>Redirecting to Allure report #${RUN_NUM}</title>" \
              "<a href=\"${RUN_NUM}/\">Allure report #${RUN_NUM}</a>" \
              > "deploy/${SUITE}/allure/index.html"

            # Persist Allure 3 history for the next workflow run
            if [ -f out/results/allure-history.jsonl ]; then
              cp out/results/allure-history.jsonl "deploy/${SUITE}/allure/history.jsonl"
            fi

            # Drop oldest numbered runs, keep the latest KEEP_REPORTS
            cd "deploy/${SUITE}/allure"
            ls -1d [0-9]* 2>/dev/null | sort -n | head -n "-${KEEP_REPORTS}" | xargs -r rm -rf
            cd "${GITHUB_WORKSPACE}"
          fi

          if [ -d out/reports/playwright ]; then
            mkdir -p "deploy/${SUITE}/playwright"
            cp -a out/reports/playwright/. "deploy/${SUITE}/playwright/"
          fi
          if [ -d out/reports/ortoni ]; then
            mkdir -p "deploy/${SUITE}/ortoni"
            cp -a out/reports/ortoni/. "deploy/${SUITE}/ortoni/"
          fi

          if [ -z "$(find deploy -type f | head -n 1)" ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy reports to reports branch
        id: deploy-reports
        if: always() && steps.stage-reports.outputs.has_files == 'true'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: reports
          folder: deploy
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout reports branch for manifest
        if: always() && steps.deploy-reports.outcome == 'success'
        uses: actions/checkout@v6.0.2
        with:
          ref: reports
          path: reports-root
      - name: Generate reports manifest
        if: always() && steps.deploy-reports.outcome == 'success'
        working-directory: reports-root
        run: |
          # Parent checkout has package.json "type": "module", so plain .js
          # is treated as ESM. Run as .cjs to keep require() working.
          cp generate_manifest.js generate_manifest.cjs
          node generate_manifest.cjs
          rm -f generate_manifest.cjs
      - name: Stage manifest for deploy
        if: always() && steps.deploy-reports.outcome == 'success'
        run: |
          mkdir -p manifest-deploy
          cp reports-root/manifest.json manifest-deploy/
      - name: Deploy updated manifest.json
        if: always() && steps.deploy-reports.outcome == 'success'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: reports
          folder: manifest-deploy
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}

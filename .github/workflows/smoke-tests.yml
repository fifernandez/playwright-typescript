name: Smoke Tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      env_name:
        description: 'Target environment'
        required: false
        default: prod
        type: choice
        options:
          - qa
          - prod
  schedule:
    - cron: '0 6 * * 3'

jobs:
  # Required check name: "smoke / run"
  smoke:
    permissions:
      contents: write
      actions: write
      checks: write
    uses: ./.github/workflows/run-playwright.yml
    with:
      suite: smoke
      env_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.env_name || 'prod' }}
    secrets: inherit
